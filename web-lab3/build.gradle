plugins {
    id 'java'
    id 'war'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group 'com.github.not.n0w'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.11.0'
}

sourceCompatibility = '17'
targetCompatibility = '17'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    compileOnly("org.glassfish:javax.faces:2.3.9")
    compileOnly("javax.servlet:javax.servlet-api:4.0.1")
    implementation("org.primefaces:primefaces:12.0.0")
    compileOnly("org.projectlombok:lombok:1.18.42")
    annotationProcessor("org.projectlombok:lombok:1.18.42")
    compileOnly("org.hibernate:hibernate-gradle-plugin:5.6.15.Final")
    implementation("org.postgresql:postgresql:42.7.8")
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    implementation("org.primefaces:primefaces:12.0.0")
    implementation("org.telegram:telegrambots:6.9.7.1")
    implementation("javax.websocket:javax.websocket-api:1.1")
    implementation("com.google.code.gson:gson:2.13.2")
    // https://mvnrepository.com/artifact/org.jboss.weld.servlet/weld-servlet-core
    compileOnly("org.jboss.weld.servlet:weld-servlet-core:6.0.3.Final")
    compileOnly ("javax.enterprise:cdi-api:2.0.SP1")
    // https://mvnrepository.com/artifact/org.primefaces.extensions/primefaces-extensions
    implementation("org.primefaces.extensions:primefaces-extensions:15.0.10")
    // https://mvnrepository.com/artifact/org.atmosphere/atmosphere-runtime
    implementation("org.atmosphere:atmosphere-runtime:3.0.14")

}

application {
    mainClass = 'com.github.not.n0w.weblab3.bot.TelegramBotApplication'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
                'Main-Class': application.mainClass
        )
    }
}